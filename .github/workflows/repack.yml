name: Publish Cursor Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
          - os: windows-latest
            system: windows
            arch: arm64
          - os: ubuntu-latest
            system: linux
            arch: x64
          - os: ubuntu-24.04-arm
            system: linux
            arch: arm64
          - os: macos-latest
            system: macos
            arch: x64
          - os: macos-latest
            system: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Install pack tools
        shell: bash
        run: |
          if [ "${{ matrix.system }}" = "windows" ]; then
            choco install 7zip -y
          elif [ "${{ matrix.system }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          else
            brew install sevenzip
          fi
      - name: Pack
        run: uv run python scripts/ci_pack.py --system "${{ matrix.system }}" --arch "${{ matrix.arch }}" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pack-${{ matrix.system }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pack-*
          path: packs
          merge-multiple: true
      - name: Read the package version
        id: version
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); from cursor_portable._version import __version__; print(__version__)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish the setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_publish.py
          --packs packs
          --version "${{ steps.version.outputs.version }}"
          --target "${{ github.sha }}"
