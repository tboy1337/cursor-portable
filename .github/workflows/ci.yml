name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: uv sync --extra dev
      - name: Install Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libnss3 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxkbcommon0
      - name: Verify
        run: uv run python scripts/verify.py
        env:
          QT_QPA_PLATFORM: offscreen

  # Publish after a push to main when the pyproject version changed, or when
  # that version still has no GitHub release.
  release-check:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Compare pyproject.toml with the previous commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run python scripts/ci_release.py
          --before "$BEFORE_SHA"
          --after-file pyproject.toml
          --github-output "$GITHUB_OUTPUT"

  publish:
    needs: release-check
    if: >-
      needs.release-check.result == 'success' &&
      needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run python scripts/ci_publish.py
          --version "${{ needs.release-check.outputs.version }}"
          --target "${{ github.sha }}"
