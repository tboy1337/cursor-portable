name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: uv sync --extra dev
      - name: Install Tk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk xvfb
      - name: Verify
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run python scripts/verify.py
          else
            uv run python scripts/verify.py
          fi

  # Publish after a push to main when the pyproject version changed, or when
  # that version still has no GitHub release. The same decision builds the
  # wheel and uploads it to PyPI. The trusted publisher is bound to this
  # workflow file name (ci.yml) and the environment name pypi.
  release-check:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Compare pyproject.toml with the previous commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run python scripts/ci_release.py
          --before "$BEFORE_SHA"
          --after-file pyproject.toml
          --github-output "$GITHUB_OUTPUT"

  publish:
    needs: release-check
    if: >-
      needs.release-check.result == 'success' &&
      needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run python scripts/ci_publish.py
          --version "${{ needs.release-check.outputs.version }}"
          --target "${{ github.sha }}"

  pypi-build:
    needs: release-check
    if: >-
      needs.release-check.result == 'success' &&
      needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Build the wheel
        run: uv build --wheel
      - name: Check the wheel version
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
        run: uv run python scripts/ci_wheel.py --version "$VERSION" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  pypi:
    needs: [release-check, pypi-build]
    if: >-
      needs.pypi-build.result == 'success' &&
      needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cursor-portable/${{ needs.release-check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the wheel version
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/cursor_portable-"${VERSION}"-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'Expected one cursor_portable-%s wheel\n' "$VERSION" >&2
            exit 1
          fi
      - name: Publish the wheel to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
